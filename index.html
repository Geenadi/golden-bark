<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search Crawler: Scrapes static link tags for search results -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <!-- Browser Tab: Dynamically switches tab icon to favicon.png for open browser tabs -->
    <script>
      (function() {
        function setTabFavicon() {
          try {
            var links = document.querySelectorAll("link[rel*='icon']");
            links.forEach(function(l) { l.parentNode.removeChild(l); });
            var icon = document.createElement('link');
            icon.rel = 'icon';
            icon.type = 'image/png';
            icon.href = '/favicon.png';
            document.head.appendChild(icon);
          } catch(e) {}
        }
        setTabFavicon();
        window.addEventListener('DOMContentLoaded', setTabFavicon);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
